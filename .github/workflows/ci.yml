name: CI

# 왜 있나 — 여기 전까지 검사는 전부 「내 PC에서 됐다」에 걸려 있었다.
# 로컬 훅은 손이 닿는 곳에만 있고 우회할 수 있다. 이 워크플로가 그 바깥의 판정자다.
#
# 여기서 하는 것은 넷뿐이다: 설치 · 타입 검사 · 시험 · 빌드.
# 비밀값을 쓰지 않는다. 비밀이 있어야 도는 검사는 여기에 넣지 않는다.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# PR 은 새로 밀어 넣으면 앞의 실행을 접는다 — 어차피 마지막 것만 보면 된다.
# main 은 접지 않는다. 접으면 그 커밋이 **검사 없이 지나간다.** 실제로 한 번 그랬다.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: 타입 · 시험 · 빌드
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web

    steps:
      # 기본 fetch-depth:1 이면 검증 결과의 codeCommit을 못 찾아
      # 통과가 전부 「재검증 필요」로 내려간다(F07-03·04). 이력을 넉넉히 둔다.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: 의존성 설치
        run: npm ci

      # Next 가 라우트·레이아웃 타입을 `.next/types` 에 만들어 두고 tsconfig 가 그걸 읽는다.
      # 내 PC 에는 지난 빌드의 잔재가 있어 통과했지만, 빈 작업 공간에서는 없어서 깨진다.
      - name: 라우트 타입 생성
        run: npx next typegen

      - name: 타입 검사
        run: npx tsc --noEmit

      - name: 시험
        run: npm test

      - name: 빌드
        run: npm run build
